name: Export Source Snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-source.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenPulse-source-snapshot
          path: ScreenPulse-src.tar.xz
          retention-days: 1
