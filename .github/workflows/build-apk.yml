name: Build ScreenPulse APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and packages
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract ScreenPulse source
        run: tar -xJf ScreenPulse-src.tar.xz
      - name: Build installable debug APK
        working-directory: ScreenPulse
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: ScreenPulse-debug-APK
          path: ScreenPulse/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
