name: Build and publish signed ScreenPulse APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'ScreenPulse-debug.apk'
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and packages
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract ScreenPulse source
        run: tar -xJf ScreenPulse-src.tar.xz

      - name: Load permanent signing key
        env:
          SCREENPULSE_KEYSTORE_BASE64: ${{ secrets.SCREENPULSE_KEYSTORE_BASE64 }}
          SCREENPULSE_STORE_PASSWORD: ${{ secrets.SCREENPULSE_STORE_PASSWORD }}
        run: |
          if [ -z "$SCREENPULSE_KEYSTORE_BASE64" ] || [ -z "$SCREENPULSE_STORE_PASSWORD" ]; then
            echo "::error::Signing secrets missing. Add SCREENPULSE_KEYSTORE_BASE64 and SCREENPULSE_STORE_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/ScreenPulse-release.jks"
          printf '%s' "$SCREENPULSE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass:env SCREENPULSE_STORE_PASSWORD -alias screenpulse >/dev/null
          echo "SCREENPULSE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Signing key loaded and alias verified."

      - name: Prepare release version and signing configuration
        working-directory: ScreenPulse
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          p = pathlib.Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          m = re.search(r'versionCode\s*=\s*(\d+)', s)
          if not m:
              raise SystemExit("Could not locate versionCode in app/build.gradle.kts")
          version_code = max(int(m.group(1)) + 1, 3)
          s = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {version_code}', s, count=1)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.2.0"', s, count=1)
          signing = '''
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("SCREENPULSE_KEYSTORE_PATH") ?: error("SCREENPULSE_KEYSTORE_PATH is missing"))
                      storePassword = System.getenv("SCREENPULSE_STORE_PASSWORD") ?: error("SCREENPULSE_STORE_PASSWORD is missing")
                      keyAlias = "screenpulse"
                      keyPassword = System.getenv("SCREENPULSE_STORE_PASSWORD") ?: error("SCREENPULSE_STORE_PASSWORD is missing")
                  }
              }
          '''
          if 'create("release")' not in s:
              if "    buildTypes {" not in s:
                  raise SystemExit("Could not locate buildTypes block")
              s = s.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s, n = re.subn(r'(release\s*\{\s*\n)', r'\1            signingConfig = signingConfigs.getByName("release")\n', s, count=1)
              if n != 1:
                  raise SystemExit("Could not attach signing config to release build type")
          p.write_text(s, encoding="utf-8")
          pathlib.Path("../version.json").write_text(json.dumps({
              "versionName": "1.2.0",
              "versionCode": version_code,
              "downloadUrl": "https://raw.githubusercontent.com/zi2111s/apk/main/ScreenPulse-debug.apk"
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Prepared signed ScreenPulse v1.2.0 (versionCode {version_code}).")
          PY

      - name: Build signed release APK
        working-directory: ScreenPulse
        env:
          SCREENPULSE_STORE_PASSWORD: ${{ secrets.SCREENPULSE_STORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signature
        run: |
          APK="ScreenPulse/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenPulse-v1.2.0-signed-APK
          path: ScreenPulse/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK and version metadata to repository
        run: |
          cp ScreenPulse/app/build/outputs/apk/release/app-release.apk ScreenPulse-debug.apk
          git add ScreenPulse-debug.apk version.json
          if git diff --cached --quiet; then
            echo "No repository changes to publish."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: publish signed ScreenPulse v1.2.0 APK [skip ci]"
            git push origin HEAD:main
          fi
