name: Build system health shortcut APK
on:
  push:
    branches: [main]
    paths:
      - 'HealthShortcut/**'
      - '.github/workflows/build-health-shortcut.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-shortcut-publish
  cancel-in-progress: false

jobs:
  build-shortcut:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Load permanent signing key
        env:
          SCREENPULSE_KEYSTORE_BASE64: ${{ secrets.SCREENPULSE_KEYSTORE_BASE64 }}
          SCREENPULSE_STORE_PASSWORD: ${{ secrets.SCREENPULSE_STORE_PASSWORD }}
        run: |
          test -n "$SCREENPULSE_KEYSTORE_BASE64" || (echo "Missing SCREENPULSE_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$SCREENPULSE_STORE_PASSWORD" || (echo "Missing SCREENPULSE_STORE_PASSWORD secret" && exit 1)
          KEYSTORE_PATH="$RUNNER_TEMP/healthshortcut-release.jks"
          printf '%s' "$SCREENPULSE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass:env SCREENPULSE_STORE_PASSWORD -alias screenpulse >/dev/null
          echo "SCREENPULSE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build signed launcher APK
        env:
          SCREENPULSE_STORE_PASSWORD: ${{ secrets.SCREENPULSE_STORE_PASSWORD }}
        run: gradle -p HealthShortcut --no-daemon :app:assembleRelease
      - name: Verify signed APK
        run: |
          APK="HealthShortcut/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HealthDeviceShortcut-signed-APK
          path: HealthShortcut/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish independent shortcut APK to repository
        run: |
          cp HealthShortcut/app/build/outputs/apk/release/app-release.apk HealthDeviceShortcut.apk
          git add HealthDeviceShortcut.apk
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: publish system health shortcut APK [skip ci]"
            git push origin HEAD:main
          fi